<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Consulta de CEP</h1>
    </header>
    <section class="consulta">
        <div class="caixa-consulta">
            <label for="CEP">Informe abaixo o CEP desejado:</label>
            <input type="number" placeholder="Informe o CEP" id="CEP" class="cep">
        </div>
        <button class="pesquisar" id="pesquisar">Pesquisar</button>
    </section>
    <section class="historico">
        <div class="historico-container">
            <h1 class="historico-h2">Histórico de Consulta:</h1>
            <div id="historico-lista" class="historico-lista"></div>
        </div>
    </section>

    <!-- defer utilizado para garantir a renderização completa do html antes da execução do script. -->
    <script src="js/scripts.js" defer></script>
</body>
</html>
